api_version: workfabric.config-bundle/v1

applications:
  work-fabric:
    api_version: workfabric.config/v1
    service:
      storage_profile: sqlite-local
      role: all
      development_mode: true
      tenant_id: tenant-local
      exchange_id: exchange-local
      cursor_secret: ${WORK_FABRIC_CURSOR_SECRET}
      listen: { host: 127.0.0.1, port: 8787 }
      sqlite:
        location: ./var/local-debug-work-fabric.db
        busy_timeout_ms: 5000
      identities:
        - authentication_evidence:
            bearer_token: ${WORK_FABRIC_DEBUG_TOKEN}
          principal:
            principal_id: principal-debug-user
            tenant_id: tenant-local
            actor_claims:
              - actor_id: actor-debug-user
                actor_type: human
                endpoint_ids: [endpoint-debug-user]
            attributes: {}
        - authentication_evidence:
            bearer_token: ${WORK_FABRIC_ADMIN_TOKEN}
          principal:
            principal_id: principal-work-fabric-admin
            tenant_id: tenant-local
            actor_claims:
              - actor_id: actor-work-fabric-admin
                actor_type: system
                endpoint_ids: [endpoint-work-fabric-admin]
            attributes: {}
        - authentication_evidence:
            bearer_token: ${INTAKE_AGENT_ACCESS_TOKEN}
          principal:
            principal_id: principal-intake-agent
            tenant_id: tenant-local
            actor_claims:
              - actor_id: actor-intake-agent
                actor_type: agent
                endpoint_ids: [endpoint-intake-agent]
            attributes: {}
      authority_rules:
        - tenant_id: tenant-local
          principal_id: principal-debug-user
          actor_id: actor-debug-user
          actor_type: human
          endpoint_id: endpoint-debug-user
          action: workfabric.handoff.offer.v1
          resource_id: null
        - tenant_id: tenant-local
          principal_id: principal-work-fabric-admin
          actor_id: actor-work-fabric-admin
          actor_type: system
          endpoint_id: endpoint-work-fabric-admin
          action: workfabric.endpoint.provision.v1
          resource_id: endpoint-intake-agent
        - tenant_id: tenant-local
          principal_id: principal-work-fabric-admin
          actor_id: actor-work-fabric-admin
          actor_type: system
          endpoint_id: endpoint-work-fabric-admin
          action: workfabric.endpoint.read.v1
          resource_id: endpoint-intake-agent
        - tenant_id: tenant-local
          principal_id: principal-intake-agent
          actor_id: actor-intake-agent
          actor_type: agent
          endpoint_id: endpoint-intake-agent
          action: workfabric.handoff.offer.v1
          resource_id: null
    agent_runtime_authority:
      grants:
        daily-assistant:
          tenant_id: tenant-local
          principal_id: principal-intake-agent
          actor_id: actor-intake-agent
          endpoint_id: endpoint-intake-agent
          subscription_id: subscription-intake-agent
    plugins:
      instances:
        debug-local:
          type: collaboration-channel.debug
          enabled: true
          config:
            connector_id: debug-local
            external_tenant_id: debug-local
            listen: { host: 127.0.0.1, port: 8791 }
            credentials:
              bearer_token: ${WORK_FABRIC_DEBUG_TOKEN}
            intake_target:
              actor_id: actor-intake-agent
              endpoint_id: endpoint-intake-agent
            participants:
              internal-user:
                mode: static
                external_subject_type: human
                external_subject_id: local-debug-user
                actor_id: actor-debug-user
                actor_type: human
                endpoint_id: endpoint-debug-user
            delegation:
              scopes: [work:read]
              may_redelegate: false
            accept_within_seconds: 86400
            result_due_within_seconds: 604800
            limits:
              max_request_bytes: 262144
              max_content_parts: 32
              max_text_bytes: 131072
              max_json_depth: 32
              max_page_size: 100
            retention:
              max_age_days: 14
              cleanup_batch_size: 500
            worker:
              poll_interval_ms: 100
              lease_seconds: 30
              batch_limit: 100
              max_attempts: 8

  daily-assistant:
    api_version: workfabric.config/v1
    service:
      runtime_id: daily-assistant-local
      development_mode: true
      work_fabric:
        base_url: http://127.0.0.1:8787
        tenant_id: tenant-local
        exchange_id: exchange-local
        actor_id: actor-intake-agent
        endpoint_id: endpoint-intake-agent
        subscription_id: subscription-intake-agent
        access_token: ${INTAKE_AGENT_ACCESS_TOKEN}
      acceptance:
        mode: accept_all_targeted
        require_explicit_target: true
        reject_expired_handoffs: true
        require_authority_scope: true
        allowed_capability_ids:
          - collaboration.request.intake
          - information.synthesis
          - collaboration.handoff.draft
      concurrency:
        max_active_runs: 2
        queue_capacity: 32
      state:
        provider: sqlite
        location: ./var/local-debug-assistant-runtime.db
        busy_timeout_ms: 5000
      capability_invocation:
        enabled: false
        max_invocations_per_handoff: 8
        max_query_invocations_per_handoff: 6
        max_query_result_bytes: 131072
        allowed_namespaces: [debug.]
    role:
      role_id: daily-assistant
      version: 1
      display_name: 日常助理 Agent
      description: 团队共享的协作入口与日常事务助理
    participant:
      actor_id: actor-intake-agent
      actor_type: agent
      endpoint_id: endpoint-intake-agent
    capabilities:
      - capability_id: collaboration.request.intake
      - capability_id: information.synthesis
      - capability_id: collaboration.handoff.draft
    plugins:
      instances:
        agently-primary:
          type: agent-runtime.agently
          enabled: true
          config:
            python:
              executable: ./runtimes/agently-worker/.venv/bin/python
              module: work_fabric_agently_runtime
            workspace_root: ./var/local-debug-agently-workspaces
            execution_timeout_seconds: 300
            cancellation_grace_seconds: 10
            provider:
              type: OpenAICompatible
              base_url: https://api.deepseek.com
              model: deepseek-v4-pro
              api_key: ${AGENTLY_MODEL_API_KEY}
