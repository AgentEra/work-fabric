api_version: workfabric.config-bundle/v1

applications:
  work-fabric:
    api_version: workfabric.config/v1
    service:
      storage_profile: sqlite-local
      role: all
      development_mode: false
      tenant_id: tenant-local
      exchange_id: exchange-local
      cursor_secret: ${WORK_FABRIC_CURSOR_SECRET}
      admission:
        subject_fingerprint_key: ${WORK_FABRIC_ADMISSION_FINGERPRINT_KEY}
        grant_active_key_id: primary
        grant_keys:
          primary: ${WORK_FABRIC_ADMISSION_GRANT_KEY}
        grant_ttl_seconds: 120
        max_evidence_cache_entries: 10000
      listen:
        host: 127.0.0.1
        port: 8787
      sqlite:
        location: ./var/work-fabric.db
        busy_timeout_ms: 5000
      identities:
        - authentication_evidence:
            bearer_token: ${FEISHU_CONNECTOR_ACCESS_TOKEN}
          principal:
            principal_id: principal-feishu-connector
            tenant_id: tenant-local
            actor_claims:
              - actor_id: actor-feishu-user
                actor_type: human
                endpoint_ids: [endpoint-feishu-user]
            attributes: {}
        - authentication_evidence:
            bearer_token: ${WORK_FABRIC_ADMIN_TOKEN}
          principal:
            principal_id: principal-work-fabric-admin
            tenant_id: tenant-local
            actor_claims:
              - actor_id: actor-work-fabric-admin
                actor_type: system
                endpoint_ids: [endpoint-work-fabric-admin]
            attributes: {}
        - authentication_evidence:
            bearer_token: ${INTAKE_AGENT_ACCESS_TOKEN}
          principal:
            principal_id: principal-intake-agent
            tenant_id: tenant-local
            actor_claims:
              - actor_id: actor-intake-agent
                actor_type: agent
                endpoint_ids: [endpoint-intake-agent]
            attributes: {}
        - authentication_evidence:
            bearer_token: ${FEISHU_PROVIDER_ACCESS_TOKEN}
          principal:
            principal_id: principal-feishu-provider
            tenant_id: tenant-local
            actor_claims:
              - actor_id: actor-feishu-provider
                actor_type: agent
                endpoint_ids: [endpoint-feishu-provider]
            attributes: {}
      authority_rules:
        - tenant_id: tenant-local
          principal_id: principal-feishu-connector
          actor_id: actor-feishu-user
          actor_type: human
          endpoint_id: endpoint-feishu-user
          action: workfabric.handoff.offer.v1
          resource_id: null
        - tenant_id: tenant-local
          principal_id: principal-feishu-connector
          actor_id: actor-feishu-user
          actor_type: human
          endpoint_id: endpoint-feishu-user
          action: workfabric.operations.connector-ingress.read.v1
          resource_id: feishu-primary
        - tenant_id: tenant-local
          principal_id: principal-work-fabric-admin
          actor_id: actor-work-fabric-admin
          actor_type: system
          endpoint_id: endpoint-work-fabric-admin
          action: workfabric.endpoint.provision.v1
          resource_id: endpoint-intake-agent
        - tenant_id: tenant-local
          principal_id: principal-work-fabric-admin
          actor_id: actor-work-fabric-admin
          actor_type: system
          endpoint_id: endpoint-work-fabric-admin
          action: workfabric.endpoint.provision.v1
          resource_id: endpoint-feishu-provider
        - tenant_id: tenant-local
          principal_id: principal-work-fabric-admin
          actor_id: actor-work-fabric-admin
          actor_type: system
          endpoint_id: endpoint-work-fabric-admin
          action: workfabric.endpoint.read.v1
          resource_id: endpoint-intake-agent
        - tenant_id: tenant-local
          principal_id: principal-work-fabric-admin
          actor_id: actor-work-fabric-admin
          actor_type: system
          endpoint_id: endpoint-work-fabric-admin
          action: workfabric.endpoint.read.v1
          resource_id: endpoint-feishu-provider
        - tenant_id: tenant-local
          principal_id: principal-work-fabric-admin
          actor_id: actor-work-fabric-admin
          actor_type: system
          endpoint_id: endpoint-work-fabric-admin
          action: workfabric.citizen.provision.v1
          resource_id: citizen-feishu-capability
        - tenant_id: tenant-local
          principal_id: principal-work-fabric-admin
          actor_id: actor-work-fabric-admin
          actor_type: system
          endpoint_id: endpoint-work-fabric-admin
          action: workfabric.citizen.provision.v1
          resource_id: citizen-feishu-context
        - tenant_id: tenant-local
          principal_id: principal-work-fabric-admin
          actor_id: actor-work-fabric-admin
          actor_type: system
          endpoint_id: endpoint-work-fabric-admin
          action: workfabric.citizen.read.v1
          resource_id: citizen-feishu-capability
        - tenant_id: tenant-local
          principal_id: principal-work-fabric-admin
          actor_id: actor-work-fabric-admin
          actor_type: system
          endpoint_id: endpoint-work-fabric-admin
          action: workfabric.citizen.read.v1
          resource_id: citizen-feishu-context
        - tenant_id: tenant-local
          principal_id: principal-feishu-provider
          actor_id: actor-feishu-provider
          actor_type: agent
          endpoint_id: endpoint-feishu-provider
          action: workfabric.citizen.session.open.v1
          resource_id: citizen-feishu-capability
        - tenant_id: tenant-local
          principal_id: principal-feishu-provider
          actor_id: actor-feishu-provider
          actor_type: agent
          endpoint_id: endpoint-feishu-provider
          action: workfabric.citizen.session.heartbeat.v1
          resource_id: citizen-feishu-capability
        - tenant_id: tenant-local
          principal_id: principal-feishu-provider
          actor_id: actor-feishu-provider
          actor_type: agent
          endpoint_id: endpoint-feishu-provider
          action: workfabric.citizen.session.declarations.replace.v1
          resource_id: citizen-feishu-capability
        - tenant_id: tenant-local
          principal_id: principal-feishu-provider
          actor_id: actor-feishu-provider
          actor_type: agent
          endpoint_id: endpoint-feishu-provider
          action: workfabric.citizen.session.close.v1
          resource_id: citizen-feishu-capability
        - tenant_id: tenant-local
          principal_id: principal-feishu-provider
          actor_id: actor-feishu-provider
          actor_type: agent
          endpoint_id: endpoint-feishu-provider
          action: workfabric.citizen.session.open.v1
          resource_id: citizen-feishu-context
        - tenant_id: tenant-local
          principal_id: principal-feishu-provider
          actor_id: actor-feishu-provider
          actor_type: agent
          endpoint_id: endpoint-feishu-provider
          action: workfabric.citizen.session.heartbeat.v1
          resource_id: citizen-feishu-context
        - tenant_id: tenant-local
          principal_id: principal-feishu-provider
          actor_id: actor-feishu-provider
          actor_type: agent
          endpoint_id: endpoint-feishu-provider
          action: workfabric.citizen.session.declarations.replace.v1
          resource_id: citizen-feishu-context
        - tenant_id: tenant-local
          principal_id: principal-feishu-provider
          actor_id: actor-feishu-provider
          actor_type: agent
          endpoint_id: endpoint-feishu-provider
          action: workfabric.citizen.session.close.v1
          resource_id: citizen-feishu-context
        - tenant_id: tenant-local
          principal_id: principal-intake-agent
          actor_id: actor-intake-agent
          actor_type: agent
          endpoint_id: endpoint-intake-agent
          action: workfabric.handoff.offer.v1
          resource_id: null
        - tenant_id: tenant-local
          principal_id: principal-intake-agent
          actor_id: actor-intake-agent
          actor_type: agent
          endpoint_id: endpoint-intake-agent
          action: workfabric.citizen.discover.v1
          resource_id: null
        - tenant_id: tenant-local
          principal_id: principal-intake-agent
          actor_id: actor-intake-agent
          actor_type: agent
          endpoint_id: endpoint-intake-agent
          action: workfabric.citizen.declaration-summary.read.v1
          resource_id: citizen-feishu-capability
        - tenant_id: tenant-local
          principal_id: principal-intake-agent
          actor_id: actor-intake-agent
          actor_type: agent
          endpoint_id: endpoint-intake-agent
          action: workfabric.citizen.declaration.read.v1
          resource_id: citizen-feishu-capability/feishu.document.append
        - tenant_id: tenant-local
          principal_id: principal-intake-agent
          actor_id: actor-intake-agent
          actor_type: agent
          endpoint_id: endpoint-intake-agent
          action: workfabric.citizen.declaration.read.v1
          resource_id: citizen-feishu-capability/feishu.document.create
        - tenant_id: tenant-local
          principal_id: principal-intake-agent
          actor_id: actor-intake-agent
          actor_type: agent
          endpoint_id: endpoint-intake-agent
          action: workfabric.citizen.declaration.read.v1
          resource_id: citizen-feishu-capability/feishu.document.delete
        - tenant_id: tenant-local
          principal_id: principal-intake-agent
          actor_id: actor-intake-agent
          actor_type: agent
          endpoint_id: endpoint-intake-agent
          action: workfabric.citizen.declaration.read.v1
          resource_id: citizen-feishu-capability/feishu.document.read
        - tenant_id: tenant-local
          principal_id: principal-intake-agent
          actor_id: actor-intake-agent
          actor_type: agent
          endpoint_id: endpoint-intake-agent
          action: workfabric.citizen.declaration.read.v1
          resource_id: citizen-feishu-capability/feishu.document.update
        - tenant_id: tenant-local
          principal_id: principal-intake-agent
          actor_id: actor-intake-agent
          actor_type: agent
          endpoint_id: endpoint-intake-agent
          action: workfabric.citizen.declaration.read.v1
          resource_id: citizen-feishu-capability/feishu.message.send
    agent_runtime_authority:
      grants:
        daily-assistant:
          tenant_id: tenant-local
          principal_id: principal-intake-agent
          actor_id: actor-intake-agent
          endpoint_id: endpoint-intake-agent
          subscription_id: subscription-intake-agent
        feishu-provider:
          tenant_id: tenant-local
          principal_id: principal-feishu-provider
          actor_id: actor-feishu-provider
          endpoint_id: endpoint-feishu-provider
          subscription_id: subscription-feishu-provider
    admission:
      evidence_providers:
        feishu-directory-primary:
          type: feishu.directory
          config:
            plugin_instance_id: feishu-primary
      policies:
        feishu-primary-participants:
          policy_id: feishu-primary-participants
          revision: "1"
          tenant_id: tenant-local
          connector_id: feishu-primary
          source_system: feishu
          external_tenant_id: ${FEISHU_EXTERNAL_TENANT_ID}
          default: deny
          allow:
            all_internal_members: true
            external_subject_ids: []
          deny:
            external_subject_ids: []
          internal_membership:
            evidence_provider_ref: feishu-directory-primary
            positive_ttl_seconds: 300
            negative_ttl_seconds: 60
          binding:
            actor_type: human
            store_ref: participant-bindings
    plugins:
      instances:
        feishu-primary:
          type: collaboration-channel.feishu
          enabled: true
          config:
            connector_id: feishu-primary
            external_tenant_id: ${FEISHU_EXTERNAL_TENANT_ID}
            bot_open_id: ${FEISHU_BOT_OPEN_ID}
            conversation_context:
              enabled: true
              lookback_seconds: 86400
              maximum_messages: 20
              maximum_bytes: 65536
            credentials:
              app_id: ${FEISHU_APP_ID}
              app_secret: ${FEISHU_APP_SECRET}
              work_fabric_access_token: ${FEISHU_CONNECTOR_ACCESS_TOKEN}
            inbound:
              enabled: true
              transport: long_connection
              mention_only: true
              intake_target:
                actor_id: actor-intake-agent
                endpoint_id: endpoint-intake-agent
              accept_within_seconds: 86400
              result_due_within_seconds: 604800
              delegation:
                scopes:
                  - work:read
                  - conversation:read
                  - document:read
                  - document:write
                  - document:delete
                  - message:send
                may_redelegate: true
            outbound:
              enabled: true
              default_render_mode: card
              channels: {}
              subscriptions: {}
            identity_admission:
              policy_id: feishu-primary-participants
            worker:
              poll_interval_ms: 1000
              lease_seconds: 30
              batch_limit: 100
              max_attempts: 8

  daily-assistant:
    api_version: workfabric.config/v1
    service:
      runtime_id: daily-assistant-local
      development_mode: true
      work_fabric:
        base_url: http://127.0.0.1:8787
        tenant_id: tenant-local
        exchange_id: exchange-local
        actor_id: actor-intake-agent
        endpoint_id: endpoint-intake-agent
        subscription_id: subscription-intake-agent
        access_token: ${INTAKE_AGENT_ACCESS_TOKEN}
      acceptance:
        mode: accept_all_targeted
        require_explicit_target: true
        reject_expired_handoffs: true
        require_authority_scope: true
        allowed_capability_ids:
          - collaboration.request.intake
          - information.synthesis
          - collaboration.handoff.draft
      concurrency:
        max_active_runs: 2
        queue_capacity: 32
      state:
        provider: sqlite
        location: ./var/daily-assistant-runtime.db
        busy_timeout_ms: 5000
      capability_invocation:
        enabled: true
        max_invocations_per_handoff: 4
        allowed_namespaces:
          - feishu.
    role:
      role_id: daily-assistant
      version: 1
      display_name: 日常助理 Agent
      description: 团队共享的协作入口与日常事务助理
    participant:
      actor_id: actor-intake-agent
      actor_type: agent
      endpoint_id: endpoint-intake-agent
    capabilities:
      - capability_id: collaboration.request.intake
      - capability_id: information.synthesis
      - capability_id: collaboration.handoff.draft
    plugins:
      instances:
        agently-primary:
          type: agent-runtime.agently
          enabled: true
          config:
            python:
              executable: ./runtimes/agently-worker/.venv/bin/python
              module: work_fabric_agently_runtime
            workspace_root: ./var/agently-workspaces
            execution_timeout_seconds: 900
            cancellation_grace_seconds: 10
            provider:
              type: OpenAICompatible
              base_url: https://api.deepseek.com
              model: deepseek-v4-pro
              api_key: ${AGENTLY_MODEL_API_KEY}

  feishu-provider:
    api_version: workfabric.config/v1
    service:
      runtime_id: feishu-provider-local
      development_mode: true
      work_fabric:
        base_url: http://127.0.0.1:8787
        tenant_id: tenant-local
        exchange_id: exchange-local
        subscription_id: subscription-feishu-provider
        access_token: ${FEISHU_PROVIDER_ACCESS_TOKEN}
      concurrency:
        max_active_runs: 2
        queue_capacity: 32
      runtime_state:
        location: ./var/feishu-provider-runtime.db
        busy_timeout_ms: 5000
      document_access:
        # Local smoke-test adapter only. It still requires the separate
        # WORK_FABRIC_ALLOW_UNSAFE_DOCUMENT_ACCESS=true process guard.
        mode: development_app_identity
        # Placement only; this is not a document ACL or allowlist.
        default_resource_uri: feishu://drive/root
      citizen_lease:
        requested_lease_seconds: 60
        heartbeat_safety_margin_ms: 5000
    participant:
      actor_id: actor-feishu-provider
      actor_type: agent
      endpoint_id: endpoint-feishu-provider
    plugins:
      instances:
        feishu-primary:
          type: capability-provider.feishu
          enabled: true
          config:
            credential_ref: feishu-primary
            open_api:
              base_url: https://open.feishu.cn
              request_timeout_ms: 10000
              max_response_bytes: 1048576
            state:
              type: sqlite
              location: ./var/feishu-provider.db
              busy_timeout_ms: 5000
            capability_citizen:
              citizen_id: citizen-feishu-capability
              principal_id: principal-feishu-provider
              actor_id: actor-feishu-provider
              endpoint_id: endpoint-feishu-provider
              registration_version: 1
            context_citizen:
              citizen_id: citizen-feishu-context
              principal_id: principal-feishu-provider
              actor_id: actor-feishu-provider
              endpoint_id: endpoint-feishu-provider
              registration_version: 1
