api_version: workfabric.config/v1

service:
  storage_profile: sqlite-local
  role: all
  development_mode: false
  tenant_id: tenant-local
  exchange_id: exchange-local
  cursor_secret: ${WORK_FABRIC_CURSOR_SECRET}
  admission:
    subject_fingerprint_key: ${WORK_FABRIC_ADMISSION_FINGERPRINT_KEY}
    grant_active_key_id: primary
    grant_keys:
      primary: ${WORK_FABRIC_ADMISSION_GRANT_KEY}
    grant_ttl_seconds: 120
    max_evidence_cache_entries: 10000

  listen:
    host: 127.0.0.1
    port: 8787

  sqlite:
    location: ./var/work-fabric.db
    busy_timeout_ms: 5000

  identities:
    - authentication_evidence:
        bearer_token: ${WORK_FABRIC_ADMIN_TOKEN}
      principal:
        principal_id: principal-work-fabric-admin
        tenant_id: tenant-local
        actor_claims:
          - actor_id: actor-work-fabric-admin
            actor_type: system
            endpoint_ids: [endpoint-work-fabric-admin]
        attributes: {}
    - authentication_evidence:
        bearer_token: ${INTAKE_AGENT_ACCESS_TOKEN}
      principal:
        principal_id: principal-intake-agent
        tenant_id: tenant-local
        actor_claims:
          - actor_id: actor-intake-agent
            actor_type: agent
            endpoint_ids: [endpoint-intake-agent]
        attributes: {}

  authority_rules:
    - tenant_id: tenant-local
      principal_id: principal-work-fabric-admin
      actor_id: actor-work-fabric-admin
      actor_type: system
      endpoint_id: endpoint-work-fabric-admin
      action: workfabric.endpoint.provision.v1
      resource_id: endpoint-intake-agent

agent_runtime_authority:
  grants:
    daily-assistant:
      tenant_id: tenant-local
      principal_id: principal-intake-agent
      actor_id: actor-intake-agent
      endpoint_id: endpoint-intake-agent
      subscription_id: subscription-intake-agent

admission:
  evidence_providers:
    feishu-directory-primary:
      type: feishu.directory
      config:
        plugin_instance_id: feishu-primary
  policies:
    feishu-primary-participants:
      policy_id: feishu-primary-participants
      revision: "1"
      tenant_id: tenant-local
      connector_id: feishu-primary
      source_system: feishu
      external_tenant_id: tenant-key-example
      default: deny
      allow:
        all_internal_members: true
        external_subject_ids: []
      deny:
        external_subject_ids: []
      internal_membership:
        evidence_provider_ref: feishu-directory-primary
        positive_ttl_seconds: 300
        negative_ttl_seconds: 60
      binding:
        actor_type: human
        store_ref: participant-bindings

plugins:
  instances:
    feishu-primary:
      type: collaboration-channel.feishu
      enabled: true
      config:
        connector_id: feishu-primary
        external_tenant_id: tenant-key-example
        bot_open_id: ou-bot-example

        credentials:
          app_id: ${FEISHU_APP_ID}
          app_secret: ${FEISHU_APP_SECRET}
          work_fabric_access_token: ${FEISHU_CONNECTOR_ACCESS_TOKEN}

        inbound:
          enabled: true
          transport: long_connection
          mention_only: true
          intake_target:
            actor_id: actor-intake-agent
            endpoint_id: endpoint-intake-agent
          accept_within_seconds: 86400
          result_due_within_seconds: 604800

        outbound:
          enabled: true
          default_render_mode: card
          channels:
            project-notifications:
              receive_id_type: chat_id
              receive_id: oc-project-example
          subscriptions:
            project-results:
              channel_ref: project-notifications
              owner:
                actor_id: actor-feishu-user
                actor_type: human
                endpoint_id: endpoint-feishu-user
              filter:
                event_types:
                  - workfabric.handoff.result_returned.v1
                  - workfabric.handoff.verified.v1

        identity_admission:
          policy_id: feishu-primary-participants

        worker:
          poll_interval_ms: 1000
          lease_seconds: 30
          batch_limit: 100
          max_attempts: 8
