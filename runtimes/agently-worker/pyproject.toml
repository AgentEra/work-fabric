[project]
name = "work-fabric-agently-runtime"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "agently==4.1.4.1",
]

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/work_fabric_agently_runtime"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
